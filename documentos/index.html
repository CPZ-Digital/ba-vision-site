<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#059669" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>B&amp;A Vision — Documentos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f4f8; min-height: 100vh; }

  .header {
    background: #fff;
    border-bottom: 3px solid #059669;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header img { height: 34px; }
  .header-title { font-size: 14px; color: #888; margin-left: 8px; border-left: 1px solid #ddd; padding-left: 16px; }

  .dashboard { padding: 40px 32px; }
  .dashboard h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 24px; }
  .cards { display: flex; flex-wrap: wrap; gap: 20px; }

  .card {
    background: #fff;
    border: 2px solid #d5eee4;
    border-radius: 10px;
    padding: 24px 28px;
    width: 220px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    text-align: center;
  }
  .card:hover { border-color: #059669; box-shadow: 0 4px 16px rgba(0,85,179,.12); }
  .card-icon { font-size: 32px; margin-bottom: 12px; }
  .card-name { font-size: 13px; font-weight: 700; color: #1a1a2e; line-height: 1.4; }
  .card-sub { font-size: 11px; color: #888; margin-top: 4px; }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 12px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
  }
  .modal-header {
    background: #059669;
    color: #fff;
    padding: 18px 24px;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 15px; }
  .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }

  .modal-body { padding: 24px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: #059669;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin: 20px 0 10px;
    border-bottom: 1px solid #d5eee4;
    padding-bottom: 4px;
  }
  .section-label:first-child { margin-top: 0; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
  .field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #c5dfd5;
    border-radius: 6px;
    font-size: 13px;
    color: #1a1a2e;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #059669; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .plano-opts { display: flex; gap: 10px; margin-top: 4px; }
  .plano-opt {
    flex: 1;
    border: 2px solid #d5eee4;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .plano-opt.selected { border-color: #059669; background: #f0fbf7; }
  .plano-opt .po-name { font-size: 12px; font-weight: 700; color: #1a1a2e; }
  .plano-opt .po-price { font-size: 16px; font-weight: 700; color: #059669; margin: 2px 0; }
  .plano-opt .po-note { font-size: 10px; color: #777; }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .btn-cancel { background: #f0f0f0; color: #555; }
  .btn-cancel:hover { background: #e0e0e0; }
  .btn-pdf { background: #059669; color: #fff; }
  .btn-pdf:hover { background: #047857; }
  .btn-pdf:disabled { background: #7fd1b4; cursor: default; }

  .toast {
    display: none;
    font-size: 12px;
    color: #059669;
    font-weight: 700;
  }

  @media (max-width:600px){ .header{padding:12px 16px} .dashboard{padding:24px 16px} .card{width:calc(50% - 10px);padding:18px 12px} }

  #lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #0b1f17; color: #e8f7f0; text-align: center; }
  #lock img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 16px; }
  #lock h1 { font-size: 20px; margin-bottom: 4px; }
  #lock p { font-size: 13px; color: #9bc7b4; margin-bottom: 18px; }
  #lock input { width: min(360px, 100%); padding: 13px 14px; border-radius: 10px; border: 1.5px solid #2f6b54; background: #102a20; color: #fff; font-size: 16px; outline: none; }
  #lock input:focus { border-color: #34d399; }
  #lock button { width: min(360px, 100%); margin-top: 10px; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  #btn-pw { background: #059669; color: #fff; }
  #btn-salva { background: #fff; color: #065f46; display: none; }
  #btn-dig { background: #fff; color: #065f46; display: none; }
  #esq-dig { display: none; background: none; border: none; color: #6ee7b7; font-size: 12px; margin-top: 14px; text-decoration: underline; cursor: pointer; }
  #lock button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #fca5a5; max-width: 360px; }
  #ver { margin-top: 26px; font-size: 10px; color: #4f7f6b; }
  #app { display: none; }
  .hdr-btn { border: 1px solid #c5dfd5; background: #fff; color: #065f46; border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="lock">
  <img src="icons/icon-192.png" alt="B&amp;A Vision" />
  <h1>Central de Documentos</h1>
  <p>Acesso restrito aos sócios.</p>
  <form id="loginf" autocomplete="on" style="width:min(360px,100%)">
    <input id="user" name="username" type="text" value="ba-documentos" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;height:1px;width:1px;pointer-events:none" />
    <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Frase-senha" autocapitalize="none" spellcheck="false" />
    <button id="btn-pw" type="submit">Desbloquear</button>
    <button id="btn-dig" type="button">👆 Entrar com a digital</button>
    <button id="btn-salva" type="button">🔑 Usar a senha salva (com digital)</button>
  </form>
  <button id="esq-dig" type="button">Esquecer a digital deste aparelho</button>
  <div id="msg"></div>
  <div id="ver">protegido · b6d276d0cc</div>
</div>

<div id="app">
  <div class="header">
    <img id="hdr-logo" alt="B&amp;A Vision" />
    <span class="header-title">Central de Documentos</span>
    <span style="flex:1"></span>
    <button class="hdr-btn" id="lock-now" style="margin-left:8px">🔒 Bloquear</button>
  </div>
  <div class="dashboard"><div id="docs-orc"></div></div>
</div>

<script src="html2pdf.bundle.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const ENC_URL = 'app.enc?v=b6d276d0cc';
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const msg = (t, ok) => { $('msg').style.color = ok ? '#86efac' : '#fca5a5'; $('msg').textContent = t || ''; };
  let enc = null, falhas = 0;

  async function carregarEnc() {
    if (enc) return enc;
    const r = await fetch(ENC_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('Não foi possível carregar o pacote (' + r.status + ').');
    enc = await r.json();
    return enc;
  }
  async function derivar(pass, e) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(e.salt), iterations: e.it, hash: 'SHA-256' }, km, 256));
  }
  async function decifrar(raw, e) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(e.iv) }, k, b64d(e.ct)));
  }
  function abrir(codigo) {
    $('lock').style.display = 'none'; $('app').style.display = 'block'; $('pw').value = '';
    const s = document.createElement('script'); s.textContent = codigo; document.body.appendChild(s);
    if (window.DOCS_LOGO) $('hdr-logo').src = window.DOCS_LOGO.ba;
    armarBloqueioAutomatico();
  }

  /* ---------- senha ---------- */
  async function entrarComSenha(veioDaDigital) {
    const pass = $('pw').value; if (!pass) { msg('Digite a frase-senha.'); return; }
    $('btn-pw').disabled = true; msg('Verificando…', true);
    try {
      const e = await carregarEnc(); const raw = await derivar(pass, e); let codigo;
      try { codigo = await decifrar(raw, e); }
      catch (_) { if (veioDaDigital && AND) { AND.clear(); $('btn-dig').style.display = 'none'; $('esq-dig').style.display = 'none'; msg('A frase-senha mudou. Digite a nova e associe a digital de novo.'); $('btn-pw').disabled = false; return; } falhas++; msg('Frase-senha incorreta.'); await new Promise(r => setTimeout(r, Math.min(8000, 800 * 2 ** (falhas - 1)))); $('btn-pw').disabled = false; return; }
      const dado = pass;
      abrir(codigo);
      // dentro do app Android: oferece associar a digital à frase-senha
      if (AND && !veioDaDigital && AND.hasBiometric() && !AND.hasSaved()) {
        setTimeout(() => { if (confirm('Associar a sua digital a este acesso?' + String.fromCharCode(10,10) + 'Da próxima vez você entra só com a digital.')) AND.save(dado); }, 600);
      }
      // oferece guardar a frase no gerenciador de senhas do celular (Chrome/Google/Bitwarden), sem chave de acesso
      try { if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) navigator.credentials.store(new PasswordCredential({ id: 'ba-documentos', password: dado, name: 'B&A Documentos' })); } catch (_) {}
    } catch (err) { msg(err.message); $('btn-pw').disabled = false; }
  }

  /* ---------- bloqueio automático ---------- */
  function armarBloqueioAutomatico() {
    let oculto = 0, ocioso;
    const bloquear = () => location.reload();
    const zerar = () => { clearTimeout(ocioso); ocioso = setTimeout(bloquear, 3 * 60 * 1000); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) oculto = Date.now(); else if (oculto && Date.now() - oculto > 60 * 1000) bloquear(); });
    ['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, zerar, { passive: true })); zerar();
  }

  /* ---------- app Android (B&A Documentos): digital e salvar PDF ---------- */
  const AND = window.BADocs || null;
  if (AND) {
    window.__baSaved = (ok, m) => { alert(ok ? 'Digital associada. Da próxima vez é só encostar o dedo.' : 'Não foi possível associar a digital: ' + m); if (ok) { $('btn-dig').style.display = 'block'; } };
    window.__baUnlocked = senha => { $('pw').value = senha; entrarComSenha(true); };
    window.__baUnlockFail = m => {
      if (m === 'invalidated') { AND.clear(); $('btn-dig').style.display = 'none'; $('esq-dig').style.display = 'none'; msg('As digitais do aparelho mudaram. Entre com a frase-senha e associe de novo.'); }
      else { msg('Digital não confirmada. Toque no botão para tentar de novo ou use a frase-senha.'); }
      $('btn-dig').disabled = false;
    };
    const chamar = () => { $('btn-dig').disabled = true; msg('Confirme com a digital…', true); AND.unlock(); };
    $('btn-dig').addEventListener('click', chamar);
    $('esq-dig').addEventListener('click', () => { if (confirm('Esquecer a digital neste aparelho? Você voltará a entrar com a frase-senha.')) { AND.clear(); $('btn-dig').style.display = 'none'; $('esq-dig').style.display = 'none'; msg('Digital esquecida.', true); } });
    if (AND.hasBiometric() && AND.hasSaved()) { $('btn-dig').style.display = 'block'; $('esq-dig').style.display = 'inline-block'; setTimeout(chamar, 500); }
    // PDFs: dentro do app o navegador não baixa arquivo, então a ponte salva em Downloads e abre
    const pega = (a) => {
      if (!a || !a.download || !String(a.href).startsWith('blob:')) return false;
      fetch(a.href).then(r => r.blob()).then(b => { const fr = new FileReader(); fr.onloadend = () => AND.saveFile(String(fr.result).split(',')[1], a.download, b.type || 'application/pdf'); fr.readAsDataURL(b); });
      return true;
    };
    const dispatchOrig = HTMLAnchorElement.prototype.dispatchEvent, clickOrig = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.dispatchEvent = function (ev) { if (ev && ev.type === 'click' && pega(this)) return true; return dispatchOrig.call(this, ev); };
    HTMLAnchorElement.prototype.click = function () { if (pega(this)) return; return clickOrig.call(this); };
  }

  $('loginf').addEventListener('submit', e => { e.preventDefault(); entrarComSenha(); });
  // "Usar a senha salva": o celular pede a digital e devolve a frase guardada no gerenciador de senhas
  async function usarSenhaSalva() {
    try {
      const c = await navigator.credentials.get({ password: true, mediation: 'optional' });
      if (c && c.password) { $('pw').value = c.password; entrarComSenha(); }
      else msg('Nenhuma senha salva. Digite a frase-senha uma vez e aceite salvar.');
    } catch (_) { msg('Não consegui abrir a senha salva. Toque no campo de senha e escolha a sugestão.'); }
  }
  $('btn-salva').addEventListener('click', usarSenhaSalva);
  if (window.PasswordCredential && navigator.credentials && navigator.credentials.get) $('btn-salva').style.display = 'block';
  $('lock-now').addEventListener('click', () => location.reload());
  if (!(AND && AND.hasBiometric && AND.hasBiometric() && AND.hasSaved())) $('pw').focus();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
