<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>B&amp;A Vision — Central de Documentos</title>
<script>
(function(){
  const SENHA_HASH = '9d3e25533e3322d6248f322cc879f8307421807f';
  async function sha1(msg){const buf=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(msg));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  async function verificar(){
    if(sessionStorage.getItem('ba_docs_auth') === SENHA_HASH) return;
    const senha = prompt('🔒 B&A Vision — Central de Documentos

Digite a senha de acesso:');
    if(!senha){ document.body.innerHTML='<p style="text-align:center;margin-top:40vh;font-family:Arial">Acesso negado.</p>'; return; }
    const hash = await sha1(senha);
    if(hash !== SENHA_HASH){ document.body.innerHTML='<p style="text-align:center;margin-top:40vh;font-family:Arial;color:red">Senha incorreta.</p>'; return; }
    sessionStorage.setItem('ba_docs_auth', hash);
  }
  document.addEventListener('DOMContentLoaded', verificar);
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f4f8; min-height: 100vh; }

  .header {
    background: #fff;
    border-bottom: 3px solid #059669;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header img { height: 34px; }
  .header-title { font-size: 14px; color: #888; margin-left: 8px; border-left: 1px solid #ddd; padding-left: 16px; }

  .dashboard { padding: 40px 32px; }
  .dashboard h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 24px; }
  .cards { display: flex; flex-wrap: wrap; gap: 20px; }

  .card {
    background: #fff;
    border: 2px solid #d5eee4;
    border-radius: 10px;
    padding: 24px 28px;
    width: 220px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    text-align: center;
  }
  .card:hover { border-color: #059669; box-shadow: 0 4px 16px rgba(0,85,179,.12); }
  .card-icon { font-size: 32px; margin-bottom: 12px; }
  .card-name { font-size: 13px; font-weight: 700; color: #1a1a2e; line-height: 1.4; }
  .card-sub { font-size: 11px; color: #888; margin-top: 4px; }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 12px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
  }
  .modal-header {
    background: #059669;
    color: #fff;
    padding: 18px 24px;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 15px; }
  .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }

  .modal-body { padding: 24px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: #059669;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin: 20px 0 10px;
    border-bottom: 1px solid #d5eee4;
    padding-bottom: 4px;
  }
  .section-label:first-child { margin-top: 0; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
  .field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #c5dfd5;
    border-radius: 6px;
    font-size: 13px;
    color: #1a1a2e;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #059669; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .plano-opts { display: flex; gap: 10px; margin-top: 4px; }
  .plano-opt {
    flex: 1;
    border: 2px solid #d5eee4;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .plano-opt.selected { border-color: #059669; background: #f0fbf7; }
  .plano-opt .po-name { font-size: 12px; font-weight: 700; color: #1a1a2e; }
  .plano-opt .po-price { font-size: 16px; font-weight: 700; color: #059669; margin: 2px 0; }
  .plano-opt .po-note { font-size: 10px; color: #777; }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .btn-cancel { background: #f0f0f0; color: #555; }
  .btn-cancel:hover { background: #e0e0e0; }
  .btn-pdf { background: #059669; color: #fff; }
  .btn-pdf:hover { background: #047857; }
  .btn-pdf:disabled { background: #7fd1b4; cursor: default; }

  .toast {
    display: none;
    font-size: 12px;
    color: #059669;
    font-weight: 700;
  }

  @media (max-width:600px){ .header{padding:12px 16px} .dashboard{padding:24px 16px} .card{width:calc(50% - 10px);padding:18px 12px} }
</style>
</head>
<body>
<div class="header">
  <img id="hdr-logo" alt="B&amp;A Vision">
  <span class="header-title">Central de Documentos</span>
</div>
<div class="dashboard"><div id="docs-orc"></div></div>
<script>window.DOCS_BRAND = 'ba';</script>
<script src="html2pdf.bundle.min.js?v=2026-10-07.2"></script>
<script src="docs-data.js?v=2026-10-07.2"></script>
<script src="docs-core.js?v=2026-10-07.2"></script>
<script src="docs-extra.js?v=2026-10-07.2"></script>
<script src="docs-manut.js?v=2026-10-07.2"></script>
<script src="docs-visita.js?v=2026-10-07.2"></script>
<script>document.getElementById('hdr-logo').src = window.DOCS_LOGO.ba;</script>
</body>
</html>
