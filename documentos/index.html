<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#059669" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>B&amp;A Vision — Documentos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f4f8; min-height: 100vh; }

  .header {
    background: #fff;
    border-bottom: 3px solid #059669;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header img { height: 34px; }
  .header-title { font-size: 14px; color: #888; margin-left: 8px; border-left: 1px solid #ddd; padding-left: 16px; }

  .dashboard { padding: 40px 32px; }
  .dashboard h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 24px; }
  .cards { display: flex; flex-wrap: wrap; gap: 20px; }

  .card {
    background: #fff;
    border: 2px solid #d5eee4;
    border-radius: 10px;
    padding: 24px 28px;
    width: 220px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
    text-align: center;
  }
  .card:hover { border-color: #059669; box-shadow: 0 4px 16px rgba(0,85,179,.12); }
  .card-icon { font-size: 32px; margin-bottom: 12px; }
  .card-name { font-size: 13px; font-weight: 700; color: #1a1a2e; line-height: 1.4; }
  .card-sub { font-size: 11px; color: #888; margin-top: 4px; }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 12px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
  }
  .modal-header {
    background: #059669;
    color: #fff;
    padding: 18px 24px;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 15px; }
  .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }

  .modal-body { padding: 24px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: #059669;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin: 20px 0 10px;
    border-bottom: 1px solid #d5eee4;
    padding-bottom: 4px;
  }
  .section-label:first-child { margin-top: 0; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
  .field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #c5dfd5;
    border-radius: 6px;
    font-size: 13px;
    color: #1a1a2e;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #059669; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .plano-opts { display: flex; gap: 10px; margin-top: 4px; }
  .plano-opt {
    flex: 1;
    border: 2px solid #d5eee4;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .plano-opt.selected { border-color: #059669; background: #f0fbf7; }
  .plano-opt .po-name { font-size: 12px; font-weight: 700; color: #1a1a2e; }
  .plano-opt .po-price { font-size: 16px; font-weight: 700; color: #059669; margin: 2px 0; }
  .plano-opt .po-note { font-size: 10px; color: #777; }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .btn-cancel { background: #f0f0f0; color: #555; }
  .btn-cancel:hover { background: #e0e0e0; }
  .btn-pdf { background: #059669; color: #fff; }
  .btn-pdf:hover { background: #047857; }
  .btn-pdf:disabled { background: #7fd1b4; cursor: default; }

  .toast {
    display: none;
    font-size: 12px;
    color: #059669;
    font-weight: 700;
  }

  @media (max-width:600px){ .header{padding:12px 16px} .dashboard{padding:24px 16px} .card{width:calc(50% - 10px);padding:18px 12px} }

  #lock { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #0b1f17; color: #e8f7f0; text-align: center; }
  #lock img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 16px; }
  #lock h1 { font-size: 20px; margin-bottom: 4px; }
  #lock p { font-size: 13px; color: #9bc7b4; margin-bottom: 18px; }
  #lock input { width: min(360px, 100%); padding: 13px 14px; border-radius: 10px; border: 1.5px solid #2f6b54; background: #102a20; color: #fff; font-size: 16px; outline: none; }
  #lock input:focus { border-color: #34d399; }
  #lock button { width: min(360px, 100%); margin-top: 10px; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  #btn-pw { background: #059669; color: #fff; }
  #btn-bio { background: #fff; color: #065f46; display: none; }
  #lock button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #fca5a5; max-width: 360px; }
  #ver { margin-top: 26px; font-size: 10px; color: #4f7f6b; }
  #app { display: none; }
  .hdr-btn { border: 1px solid #c5dfd5; background: #fff; color: #065f46; border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #bio-on { display: none; }
</style>
</head>
<body>

<div id="lock">
  <img src="icons/icon-192.png" alt="B&amp;A Vision" />
  <h1>Central de Documentos</h1>
  <p>Acesso restrito aos sócios.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Frase-senha" autocapitalize="none" spellcheck="false" />
  <button id="btn-pw">Desbloquear</button>
  <button id="btn-bio">👆 Desbloquear com biometria</button>
  <div id="msg"></div>
  <div id="ver">protegido · cbf8a26448</div>
</div>

<div id="app">
  <div class="header">
    <img id="hdr-logo" alt="B&amp;A Vision" />
    <span class="header-title">Central de Documentos</span>
    <span style="flex:1"></span>
    <button class="hdr-btn" id="bio-on">👆 Ativar biometria</button>
    <button class="hdr-btn" id="lock-now" style="margin-left:8px">🔒 Bloquear</button>
  </div>
  <div class="dashboard"><div id="docs-orc"></div></div>
</div>

<script src="html2pdf.bundle.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const ENC_URL = 'app.enc?v=cbf8a26448';
  const BIO_KEY = 'ba_docs_bio_v1';
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const msg = (t, ok) => { $('msg').style.color = ok ? '#86efac' : '#fca5a5'; $('msg').textContent = t || ''; };
  let rawKey = null, enc = null, falhas = 0;

  async function carregarEnc() {
    if (enc) return enc;
    const r = await fetch(ENC_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('Não foi possível carregar o pacote (' + r.status + ').');
    enc = await r.json();
    return enc;
  }
  async function derivar(pass, e) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(e.salt), iterations: e.it, hash: 'SHA-256' }, km, 256));
  }
  async function decifrar(raw, e) {
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(e.iv) }, k, b64d(e.ct)));
  }
  function abrir(codigo) {
    $('lock').style.display = 'none'; $('app').style.display = 'block'; $('pw').value = '';
    const s = document.createElement('script'); s.textContent = codigo; document.body.appendChild(s);
    if (window.DOCS_LOGO) $('hdr-logo').src = window.DOCS_LOGO.ba;
    if (bioSuportada() && !localStorage.getItem(BIO_KEY)) $('bio-on').style.display = 'inline-block';
    armarBloqueioAutomatico();
  }

  /* ---------- senha ---------- */
  async function entrarComSenha() {
    const pass = $('pw').value; if (!pass) { msg('Digite a frase-senha.'); return; }
    $('btn-pw').disabled = true; msg('Verificando…', true);
    try {
      const e = await carregarEnc(); const raw = await derivar(pass, e); let codigo;
      try { codigo = await decifrar(raw, e); }
      catch (_) { falhas++; msg('Frase-senha incorreta.'); await new Promise(r => setTimeout(r, Math.min(8000, 800 * 2 ** (falhas - 1)))); $('btn-pw').disabled = false; return; }
      rawKey = raw; abrir(codigo);
    } catch (err) { msg(err.message); $('btn-pw').disabled = false; }
  }

  /* ---------- biometria (WebAuthn + PRF: a chave só sai do aparelho com a digital/rosto) ---------- */
  function bioSuportada() { return !!(window.PublicKeyCredential && navigator.credentials && crypto.subtle); }
  async function chaveDoPrf(prfBytes) { return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', prfBytes), 'AES-GCM', false, ['encrypt', 'decrypt']); }
  async function pedirPrf(credId, salt) {
    const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
    const r = a.getClientExtensionResults().prf; return r && r.results && r.results.first;
  }
  async function ativarBiometria() {
    if (!rawKey) return;
    try {
      const cred = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'B&A Documentos', id: location.hostname }, user: { id: rnd(16), name: 'ba-documentos', displayName: 'B&A Documentos' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' }, timeout: 60000, extensions: { prf: {} } } });
      const ext = cred.getClientExtensionResults();
      if (!ext.prf || !ext.prf.enabled) throw new Error('Este aparelho não suporta biometria com chave protegida.');
      const salt = rnd(32), prf = await pedirPrf(cred.rawId, salt);
      if (!prf) throw new Error('Não foi possível obter a chave da biometria.');
      const iv = rnd(12), wrapped = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await chaveDoPrf(prf), rawKey);
      localStorage.setItem(BIO_KEY, JSON.stringify({ id: b64e(cred.rawId), salt: b64e(salt), iv: b64e(iv), w: b64e(wrapped), stamp: 'cbf8a26448' }));
      $('bio-on').style.display = 'none'; alert('Biometria ativada neste aparelho.');
    } catch (err) { alert('Não foi possível ativar a biometria: ' + (err && err.message ? err.message : err)); }
  }
  async function entrarComBiometria() {
    const reg = JSON.parse(localStorage.getItem(BIO_KEY) || 'null'); if (!reg) return;
    $('btn-bio').disabled = true; msg('Confirme com a biometria…', true);
    try {
      const prf = await pedirPrf(b64d(reg.id), b64d(reg.salt)); if (!prf) throw new Error('sem chave');
      const raw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(reg.iv) }, await chaveDoPrf(prf), b64d(reg.w)));
      const e = await carregarEnc(); let codigo;
      try { codigo = await decifrar(raw, e); }
      catch (_) { localStorage.removeItem(BIO_KEY); $('btn-bio').style.display = 'none'; msg('A senha mudou. Entre com a frase-senha e ative a biometria de novo.'); $('btn-bio').disabled = false; return; }
      rawKey = raw; abrir(codigo);
    } catch (err) { msg('Biometria não confirmada. Use a frase-senha.'); $('btn-bio').disabled = false; }
  }

  /* ---------- bloqueio automático ---------- */
  function armarBloqueioAutomatico() {
    let oculto = 0, ocioso;
    const bloquear = () => location.reload();
    const zerar = () => { clearTimeout(ocioso); ocioso = setTimeout(bloquear, 3 * 60 * 1000); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) oculto = Date.now(); else if (oculto && Date.now() - oculto > 60 * 1000) bloquear(); });
    ['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, zerar, { passive: true })); zerar();
  }

  $('btn-pw').addEventListener('click', entrarComSenha);
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') entrarComSenha(); });
  $('btn-bio').addEventListener('click', entrarComBiometria);
  $('bio-on').addEventListener('click', ativarBiometria);
  $('lock-now').addEventListener('click', () => location.reload());
  if (bioSuportada() && localStorage.getItem(BIO_KEY)) $('btn-bio').style.display = 'block'; else $('pw').focus();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
